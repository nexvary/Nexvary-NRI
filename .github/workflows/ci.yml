name: NRI CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - name: Install bilingual report runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-core fonts-dejavu-core
          python3 -m venv "$RUNNER_TEMP/nri-report-python"
          "$RUNNER_TEMP/nri-report-python/bin/python" -m pip install -r scripts/report-requirements.txt
      - name: Run unit and integration tests with real report rendering
        run: |
          export NRI_REPORT_PYTHON="$RUNNER_TEMP/nri-report-python/bin/python"
          npm test
